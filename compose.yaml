name: moodle-local-stack

x-moodle-env: &moodle-env
  MOODLE_DB_HOST: db
  MYSQL_DATABASE: ${MYSQL_DATABASE}
  MYSQL_USER: ${MYSQL_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
  MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-Moodle local stack}
  MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}

# Shared by the CPU and GPU runtime services. Only one of them runs (profile cpu or gpu);
# both answer as `ollama` on backend, so OLLAMA_URL does not depend on the profile.
x-ollama: &ollama
  image: ollama/ollama:0.35.1
  restart: unless-stopped
  environment:
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    OLLAMA_NUM_PARALLEL: "1"
    OLLAMA_MAX_LOADED_MODELS: "1"
  volumes:
    - ollama_models:/root/.ollama
  # The image has no curl or wget; the CLI talks to the local server.
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s
  networks:
    backend:
      aliases:
        - ollama

services:
  db:
    image: mysql:8.4.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - backend

  moodle:
    image: moodle-local-stack/moodle:${MOODLE_VERSION:-v5.3.0}
    build:
      context: .
      dockerfile: docker/moodle/Dockerfile
      args:
        MOODLE_VERSION: ${MOODLE_VERSION:-v5.3.0}
    restart: unless-stopped
    environment:
      <<: *moodle-env
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      # Read by scripts/moodle/configure-askdata.sh, which the entrypoint runs on every start.
      ASKDATA_SHARED_SECRET: ${ASKDATA_SHARED_SECRET}
      ASKDATA_SERVICE_URL: ${ANALYTICS_URL:-http://analytics:8000}
      BACKEND_SUBNET: ${BACKEND_SUBNET:-172.28.0.0/24}
    init: true
    volumes:
      - moodledata:/var/www/moodledata
      - phpunitdata:/var/www/phpunitdata
      - ./scripts/moodle:/opt/stack/scripts:ro
      # Overrides the copy baked into the image, so plugin edits need no rebuild.
      - ./plugin/local_askdata:/var/www/html/public/local/askdata:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    # No published port and no internet: browsers reach Moodle through `proxy` over `web`.
    networks:
      - web
      - backend

  proxy:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    volumes:
      - ./docker/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${MOODLE_PORT:-8080}:80"
    depends_on:
      - moodle
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/.proxy-health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    # The only service on frontend, so the only one with a published port (and egress).
    networks:
      - frontend
      - web

  cron:
    image: moodle-local-stack/moodle:${MOODLE_VERSION:-v5.3.0}
    restart: unless-stopped
    command: ["cron"]
    init: true
    environment:
      <<: *moodle-env
    volumes:
      - moodledata:/var/www/moodledata
      # Same code as moodle, otherwise cron sees a pending upgrade and stops.
      - ./plugin/local_askdata:/var/www/html/public/local/askdata:ro
    depends_on:
      db:
        condition: service_healthy
      moodle:
        condition: service_started
    networks:
      - backend

  # One-shot: creates analytics_ro and grants SELECT per table once Moodle has created
  # its tables. Runs on every `up`, so existing volumes get the current grants too.
  db-grants:
    image: mysql:8.4.11
    restart: "no"
    entrypoint: ["bash", "/opt/stack/analytics-grants.sh"]
    environment:
      MYSQL_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - ./docker/db/analytics-grants.sh:/opt/stack/analytics-grants.sh:ro
      - ./docker/db/analytics-tables.txt:/opt/stack/analytics-tables.txt:ro
    depends_on:
      moodle:
        condition: service_healthy
    networks:
      - backend

  analytics:
    image: moodle-local-stack/analytics:dev
    build:
      context: ./analytics
    restart: unless-stopped
    # Explicit list instead of env_file: the service never sees the MySQL root or Moodle passwords.
    environment:
      ANALYTICS_DB_HOST: db
      ANALYTICS_DB_PORT: "3306"
      ANALYTICS_DB_NAME: ${MYSQL_DATABASE}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      ANALYTICS_SALT: ${ANALYTICS_SALT}
      EXPORT_FORMAT: ${EXPORT_FORMAT:-duckdb}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-15}
      EXPORT_TIMEOUT_S: ${EXPORT_TIMEOUT_S:-600}
      MAX_ROWS: ${MAX_ROWS:-200}
      ASKDATA_SHARED_SECRET: ${ASKDATA_SHARED_SECRET}
      ASKDATA_REPLAY_WINDOW_S: ${ASKDATA_REPLAY_WINDOW_S:-300}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-150}
      ASK_CONCURRENCY: ${ASK_CONCURRENCY:-2}
      EXAMPLES_TOP_K: ${EXAMPLES_TOP_K:-6}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-512MB}
      DUCKDB_THREADS: ${DUCKDB_THREADS:-2}
    volumes:
      - analytics_data:/data
    depends_on:
      db:
        condition: service_healthy
      moodle:
        condition: service_healthy
      db-grants:
        condition: service_completed_successfully
    # No published port. Moodle reaches http://analytics:8000 over backend, which is
    # internal, so Docker would not publish one anyway. Debug with `make sql` or
    # `docker compose exec analytics python -c "..."`.
    networks:
      - backend

  ollama:
    <<: *ollama
    profiles: ["cpu"]

  ollama-gpu:
    <<: *ollama
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot download into the shared volume. It is the only Ollama container with
  # internet access (egress) and it is never attached to backend.
  model-init:
    image: ollama/ollama:0.35.1
    profiles: ["init"]
    entrypoint: ["/bin/sh", "/opt/stack/model-init.sh"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    volumes:
      - ollama_models:/root/.ollama
      - ./scripts/model-init.sh:/opt/stack/model-init.sh:ro
    networks:
      - egress

networks:
  # Published ports only work on non-internal networks, so frontend holds the proxy alone.
  frontend:
  web:
    internal: true
  # Pinned so Moodle's curl security can allow exactly this range (scripts/moodle/configure-askdata.sh).
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.28.0.0/24}
  egress:

volumes:
  db_data:
  moodledata:
  phpunitdata:
  analytics_data:
  ollama_models:
