# The only container with a published port. Moodle sits on the internal `web`
# network and has no route to the internet; this proxy only forwards to it.
server {
    listen 80;
    server_name _;

    client_max_body_size 64m;

    # Docker DNS, re-resolved so a recreated moodle container (new IP) is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $moodle http://moodle:80;

    location = /.proxy-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $moodle;
        # $http_host keeps the port the browser used (localhost:8080), so Moodle
        # sees the same Host as without the proxy and wwwroot matches unchanged.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
