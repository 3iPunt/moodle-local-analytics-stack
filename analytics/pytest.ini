[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider
markers =
    docker: needs the docker CLI and the running stack, skipped otherwise; run from the host (STACK_SMOKE=1)
    integration: needs the running stack (MySQL with demo data); skipped when unreachable
    ollama: needs a reachable Ollama with OLLAMA_MODEL pulled; skipped when unreachable
